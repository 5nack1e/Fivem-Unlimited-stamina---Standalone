name: Discord Push Notifications

on:
  push:

permissions:
  contents: read

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send push summary to Discord
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) {
              core.setFailed('Missing DISCORD_WEBHOOK_URL secret.');
              return;
            }

            const payload = context.payload || {};
            const commits = payload.commits || [];
            const branch = (payload.ref || '').replace('refs/heads/', '') || 'unknown';
            const compareUrl = payload.compare || `https://github.com/${context.repo.owner}/${context.repo.repo}/commits/${branch}`;

            const commitLines = commits
              .slice(0, 10)
              .map((c) => {
                const shortSha = (c.id || '').slice(0, 7) || 'unknown';
                const message = (c.message || '').split('\n')[0] || 'No message';
                const author = c.author && c.author.name ? c.author.name : 'unknown';
                return `- [${shortSha}](${c.url}) ${message} (${author})`;
              })
              .join('\n');

            const extra = commits.length > 10 ? `\n...and ${commits.length - 10} more commit(s).` : '';
            const commitSummary = (commitLines || 'No commit details found in payload.') + extra;

            const body = {
              embeds: [
                {
                  title: `Push to ${context.repo.owner}/${context.repo.repo}`,
                  url: compareUrl,
                  color: 3447003,
                  fields: [
                    { name: 'Branch', value: branch, inline: true },
                    { name: 'Pusher', value: payload.pusher && payload.pusher.name ? payload.pusher.name : context.actor, inline: true },
                    { name: 'Commits', value: String(commits.length), inline: true },
                    { name: 'Changes', value: commitSummary.slice(0, 1024) }
                  ],
                  timestamp: new Date().toISOString()
                }
              ]
            };

            const response = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });

            if (!response.ok) {
              const text = await response.text();
              core.setFailed(`Discord webhook failed (${response.status}): ${text}`);
            }
